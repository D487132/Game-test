<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff4df">
  <title>Crumble Corner — Cookie Clicker</title>
  <style>
    :root { color-scheme: light; --ink:#42291f; --muted:#876c5c; --cream:#fff8ec; --pink:#f6c6b8; --gold:#f2bd59; --brown:#74442f; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif; background:radial-gradient(ellipse at 50% 18%,#fffdf7 0,#fff5e3 48%,#f8e3c5 100%); }
    header { max-width:1100px; margin:auto; padding:25px 28px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px }
    .brand { font-weight:900; letter-spacing:-.04em; font-size:1.15rem } .brand span { color:#c46b48 }
    .top-note { font-size:.83rem; color:var(--muted) }
    main { max-width:1100px; margin:0 auto; padding:24px 28px 40px; display:grid; grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr); gap:26px; align-items:stretch }
    .play-card,.shop-card { border:1px solid #ead7bc; border-radius:28px; background:rgba(255,252,245,.84); box-shadow:0 16px 45px #8b5b3015; }
    .play-card { min-height:590px; padding:34px 24px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; position:relative }
    .play-card:before { content:""; position:absolute; width:390px;height:390px;border-radius:50%;background:#f8e8cc;top:50%;left:50%;transform:translate(-50%,-37%);opacity:.58 }
    .eyebrow { position:relative; color:#a06d4b; font-size:.76rem; letter-spacing:.16em; font-weight:900; text-transform:uppercase }
    h1 { position:relative; margin:8px 0 4px; font-size:clamp(2rem,5vw,3.4rem); letter-spacing:-.065em; line-height:1.05 }
    .score { position:relative; margin-top:17px; font-size:clamp(2.3rem,6vw,4rem); font-weight:950; letter-spacing:-.06em; font-variant-numeric:tabular-nums }
    .score-label { position:relative; color:var(--muted); font-size:.9rem; margin-top:-3px }
    .cookie-wrap { position:relative; margin:25px 0 17px; width:250px;height:250px;display:grid;place-items:center }
    .cookie { width:220px;height:220px;border:0;border-radius:50%;cursor:pointer;position:relative;touch-action:manipulation; background:radial-gradient(circle at 35% 28%,#d99a57 0 8%,transparent 9%),radial-gradient(circle at 69% 34%,#593322 0 4%,transparent 4.7%),radial-gradient(circle at 43% 67%,#623922 0 4%,transparent 4.8%),radial-gradient(circle at 70% 70%,#d99a57 0 7%,transparent 7.8%),radial-gradient(circle at 55% 48%,#653c27 0 4%,transparent 4.8%),radial-gradient(circle at 27% 58%,#623922 0 4%,transparent 4.7%),radial-gradient(circle at 60% 23%,#623922 0 3.5%,transparent 4.4%),radial-gradient(circle at 25% 38%,#f0c17e 0 6%,transparent 7%),radial-gradient(circle at 52% 51%,#d89a54 0,#bd733b 72%,#92512f 100%); box-shadow:inset -12px -14px 0 #824c2e33,inset 8px 9px 0 #ffdb9c66,0 14px 0 #814b2c,0 23px 26px #70452638; transition:transform .12s,filter .12s; animation:bob 3s ease-in-out infinite; }
    .cookie:hover { filter:brightness(1.06) } .cookie:active { transform:scale(.93) translateY(5px); box-shadow:inset -12px -14px 0 #824c2e33,inset 8px 9px 0 #ffdb9c66,0 8px 0 #814b2c,0 13px 18px #70452638 }
    @keyframes bob { 50% { transform:translateY(-6px) rotate(2deg) } }
    .cookie:focus-visible,.buy:focus-visible,.reset:focus-visible { outline:3px solid #c46b48; outline-offset:4px }
    .hint { position:relative; color:var(--muted);font-size:.9rem } .hint strong { color:var(--brown) }
    .stats { position:relative;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px }
    .pill { padding:9px 13px; border:1px solid #eedfc9; border-radius:99px; background:#fffaf1; font-size:.82rem; color:#725746 }
    .shop-card { padding:27px;display:flex;flex-direction:column }
    .shop-head { display:flex;justify-content:space-between;align-items:end;gap:12px;padding-bottom:18px;border-bottom:1px solid #efdfc9 }
    h2 { margin:0;font-size:1.5rem;letter-spacing:-.04em } .shop-head p { margin:5px 0 0;color:var(--muted);font-size:.85rem }
    .shop-icon { width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#fff0d2;font-size:1.4rem }
    .upgrades { display:grid;gap:11px;margin-top:18px }
    .upgrade { display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:11px;padding:13px;border:1px solid #efdfca;border-radius:18px;background:#fffdf8;transition:opacity .15s,border-color .15s,transform .15s }
    .upgrade.ready { border-color:#e9bf7d;cursor:pointer } .upgrade.ready:hover { transform:translateY(-2px);border-color:#d99653 }
    .upgrade.locked { opacity:.56 }
    .up-icon { width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#fff1d8;font-size:1.35rem }
    .up-name { font-weight:850;font-size:.94rem } .up-desc { color:var(--muted);font-size:.74rem;margin-top:3px;line-height:1.3 }
    .buy { border:0;border-radius:12px;padding:9px 11px;background:#f1c46c;color:#4b2c1c;font:inherit;font-weight:900;font-size:.78rem;white-space:nowrap;cursor:pointer }
    .buy:disabled { background:#eee4d4;color:#9b8a78;cursor:not-allowed }
    .shop-foot { margin-top:auto;padding-top:19px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.77rem }
    .reset { padding:7px 10px;background:transparent;border:1px solid #e8d7c0;border-radius:10px;color:#826b58;font:inherit;cursor:pointer }
    .float { position:absolute;z-index:2;pointer-events:none;font-weight:950;font-size:1.35rem;color:#9e4e2e;text-shadow:0 2px #fff4dc;animation:rise .85s ease-out forwards }
    @keyframes rise { to { transform:translateY(-90px) scale(1.2);opacity:0 } }
    @media(max-width:760px) { header{padding:18px 18px 4px} main{padding:14px 16px 28px;grid-template-columns:1fr;gap:16px}.play-card{min-height:500px;padding:28px 20px}.shop-card{padding:22px}.cookie-wrap{margin:20px 0 14px} }
    @media(prefers-reduced-motion:reduce) { *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important} }
  </style>
</head>
<body>
  <header><div class="brand">🍪 <span>CRUMBLE</span> CORNER</div><div class="top-note">A tiny cozy cookie game</div></header>
  <main>
    <section class="play-card" aria-label="Cookie bakery">
      <div class="eyebrow">Fresh from the oven</div>
      <h1>Cookie bakery</h1>
      <div class="score" id="score" aria-live="polite">0</div><div class="score-label">cookies baked</div>
      <div class="cookie-wrap"><button class="cookie" id="cookie" aria-label="Bake a cookie"></button></div>
      <div class="hint">Click the cookie to bake <strong id="perClick">1</strong></div>
      <div class="stats"><div class="pill">🍪 <span id="cps">0</span> per second</div><div class="pill">🧑‍🍳 <span id="bakers">0</span> helpers</div></div>
    </section>
    <aside class="shop-card" aria-label="Bakery upgrades">
      <div class="shop-head"><div><h2>Little upgrades</h2><p>Make your bakery busier.</p></div><div class="shop-icon">🧺</div></div>
      <div class="upgrades" id="upgrades"></div>
      <div class="shop-foot"><span>Progress saves on this device</span><button class="reset" id="reset">Start fresh</button></div>
    </aside>
  </main>
  <script>
    const upgrades = [
      { id:"grandma", name:"Cookie helper", icon:"👵", desc:"A kind baker makes cookies for you.", base:15, cps:1 },
      { id:"oven", name:"Comfy oven", icon:"🔥", desc:"A warm oven bakes a little faster.", base:100, cps:7 },
      { id:"farm", name:"Cookie garden", icon:"🌱", desc:"Plant cocoa beans and cookie dreams.", base:650, cps:35 },
      { id:"truck", name:"Delivery cart", icon:"🛒", desc:"Bring fresh cookies to the whole town.", base:4200, cps:180 }
    ];
    const saveKey = "crumble-corner-save-v1";
    const freshState = () => ({ cookies:0, total:0, clickPower:1, owned:Object.fromEntries(upgrades.map(x=>[x.id,0])) });
    let state = freshState();
    try { const saved=JSON.parse(localStorage.getItem(saveKey)); if(saved && typeof saved.cookies==="number" && saved.owned) state={...freshState(),...saved,owned:{...freshState().owned,...saved.owned}}; } catch {}
    const scoreEl=document.querySelector("#score"), clickEl=document.querySelector("#perClick"), cpsEl=document.querySelector("#cps"), bakersEl=document.querySelector("#bakers"), listEl=document.querySelector("#upgrades");
    const amount = n => Math.floor(n).toLocaleString();
    const cost = item => Math.ceil(item.base * Math.pow(1.16,state.owned[item.id]||0));
    const cps = () => upgrades.reduce((sum,item)=>sum+item.cps*(state.owned[item.id]||0),0);
    function save(){ try { localStorage.setItem(saveKey,JSON.stringify(state)); } catch {} }
    function render(){
      scoreEl.textContent=amount(state.cookies); clickEl.textContent=amount(state.clickPower); cpsEl.textContent=amount(cps());
      bakersEl.textContent=amount(Object.values(state.owned).reduce((a,b)=>a+b,0));
      listEl.innerHTML=upgrades.map(item=>{const price=cost(item),owned=state.owned[item.id]||0,can=state.cookies>=price;return `<article class="upgrade ${can?"ready":"locked"}"><div class="up-icon">${item.icon}</div><div><div class="up-name">${item.name} <span style="color:#a17b5b;font-weight:700">×${owned}</span></div><div class="up-desc">${item.desc} +${item.cps} cookies/sec</div></div><button class="buy" data-buy="${item.id}" ${can?"":"disabled"}>${amount(price)} 🍪</button></article>`}).join("");
      save();
    }
    function floatText(x,y,text){const el=document.createElement("span");el.className="float";el.textContent=text;el.style.left=`${x}px`;el.style.top=`${y}px`;document.body.append(el);setTimeout(()=>el.remove(),900)}
    document.querySelector("#cookie").addEventListener("click",e=>{state.cookies+=state.clickPower;state.total+=state.clickPower;render();floatText(e.clientX,e.clientY,`+${amount(state.clickPower)} 🍪`)});
    listEl.addEventListener("click",e=>{const id=e.target.closest("[data-buy]")?.dataset.buy;if(!id)return;const item=upgrades.find(x=>x.id===id),price=cost(item);if(state.cookies<price)return;state.cookies-=price;state.owned[id]=(state.owned[id]||0)+1;render()});
    document.querySelector("#reset").addEventListener("click",()=>{if(confirm("Start over and reset your bakery?")){state=freshState();render()}});
    setInterval(()=>{const earned=cps()/10;if(earned){state.cookies+=earned;state.total+=earned;render()}},100);
    render();
  </script>
</body>
</html>
